[package]
name = "ge_rust"
version = "0.1.0"
build = "build.rs"
edition = "2024"
publish = false
autotests = false

[lib]
# Produce a C-compatible static archive that CMake can link into the plugin.
crate-type = ["staticlib", "rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bin]]
name = "export-api"
path = "src/bin/export_api.rs"

[features]
# Enabled by the CMake build when BROWSER_DEV=ON. Turns on permissive CORS so
# the SPA served from the Vite dev server (a different origin) can call the API.
dev = []
# Test-only env seams (mock YouTube endpoints, OAuth state, browser-open skip, file
# token store) for integration tests. Enabled only by the Rust test recipes, never by
# the CMake/package build, so it is compiled out of shipping binaries.
test-hooks = ["ge_catalog/test-hooks"]

[build-dependencies]
cbindgen = "0.29.3"


[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.22.1"
bmp = "0.5.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
obfstr = "0.4.5"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls", "charset", "http2", "system-proxy", "cookies"] }
scraper = "0.24.0"
rfd = "0.17.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.6.11", features = ["trace", "util", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs.workspace = true
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
ge_settings = { path = "../settings" }
ge_cv = { path = "../cv" }
ge_game = { path = "../game" }
ge_clip = { path = "../clip" }
ge_media = { path = "../media" }
ge_catalog = { path = "../catalog" }

[dev-dependencies]
futures-util = "0.3.31"
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["static", "codec", "format", "software-resampling", "software-scaling"] }
http-body-util = "0.1.3"
# Core's image-based tests use OpenCV directly; production gets it through ge_cv.
opencv = { version = "0.98.2", features = ["clang-runtime"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio-tungstenite = "0.29.0"
