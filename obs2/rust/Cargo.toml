[workspace]
members = ["catalog", "clip", "cv", "game", "media", "runtime", "settings"]
default-members = ["runtime"]
resolver = "3"

[workspace.dependencies]
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

[profile.dist]
inherits = "release"
# Reducing binary size. See: https://github.com/johnthagen/min-sized-rust
strip = true
lto = true
codegen-units = 1
