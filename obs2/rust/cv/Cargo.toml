[package]
name = "ge_cv"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "test_match"
path = "src/bin/test_match.rs"
test = false

[[bin]]
name = "annotate_match"
path = "src/bin/annotate_match.rs"
test = false

[dependencies]
ge_game = { path = "../game" }
# Match ffmpeg-sys-next's runtime libclang loading when the full plugin builds.
opencv = { version = "0.98.2", features = ["clang-runtime"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ts-rs.workspace = true
